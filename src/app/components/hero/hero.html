<section
  id="inicio"
  class="relative overflow-hidden bg-[var(--equipark-dark-deep)] text-white"
>

  <div
    class="
      max-w-7xl
      mx-auto
      px-5
      sm:px-8
      lg:px-10
      py-16
      sm:py-20
      lg:py-28
    "
  >

    <div class="max-w-3xl">

      <!-- BADGE -->

      <div
        class="
          inline-flex
          items-center
          gap-2
          rounded-full
          border
          border-[var(--equipark-primary)]
          px-4
          py-2
          text-sm
          font-bold
          text-[var(--equipark-primary)]
        "
      >
        <span
          class="w-2 h-2 rounded-full bg-[var(--equipark-primary)]"
        ></span>

        GPS para tu vehículo
      </div>


      <!-- TITULAR -->

      <h1
        class="
          mt-6
          text-4xl
          sm:text-5xl
          lg:text-7xl
          font-black
          tracking-tight
          leading-[1.05]
        "
      >
        Sabes dónde está tu vehículo,
        <span class="text-[var(--equipark-primary)]">
          siempre.
        </span>
      </h1>


      <!-- DESCRIPCIÓN -->

      <p
        class="
          mt-6
          max-w-2xl
          text-lg
          sm:text-xl
          leading-relaxed
          text-slate-300
        "
      >
        Controla la ubicación de tu vehículo en tiempo real
        y disfruta la tranquilidad de tenerlo siempre bajo
        control.
      </p>


      <!-- CTA -->

      <div
        class="
          mt-8
          flex
          flex-col
          sm:flex-row
          gap-3
        "
      >

        <button
          type="button"
          class="
            btn-primary
            w-full
            sm:w-auto
            px-7
          "
          (click)="irAPlanes()"
        >
          Elige tu GPS
        </button>

        <a
          href="#como-funciona"
          class="
            inline-flex
            items-center
            justify-center
            min-h-[48px]
            px-7
            rounded-[var(--radius-button)]
            border
            border-white/30
            text-white
            font-bold
            hover:bg-white/10
            transition
          "
        >
          ¿Cómo funciona?
        </a>

      </div>


      <!-- CONFIANZA -->

      <div
        class="
          mt-10
          flex
          flex-col
          sm:flex-row
          gap-5
          sm:gap-8
          text-sm
          text-slate-300
        "
      >

        <div class="flex items-center gap-2">
          <span class="text-[var(--equipark-primary)] font-black">✓</span>
          Rastreo en tiempo real
        </div>

        <div class="flex items-center gap-2">
          <span class="text-[var(--equipark-primary)] font-black">✓</span>
          Instalación incluida
        </div>

        <div class="flex items-center gap-2">
          <span class="text-[var(--equipark-primary)] font-black">✓</span>
          Atención 24/7
        </div>

      </div>

    </div>

  </div>

</section>
